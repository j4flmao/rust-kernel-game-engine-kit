name: coverage

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llvm-cov:
    name: LLVM coverage report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lib --tests --lcov --output-path lcov.info -- --test-threads=1
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-cov-report
          path: lcov.info
          if-no-files-found: error
