name: GPU quality milestone

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      runner_label:
        description: >-
          Optional runner label. The default windows-latest runner is free and
          uses the software Vulkan lane. Set this only when a real GPU runner
          is available.
        required: true
        default: "windows-latest"
        type: string
      frames:
        description: Number of Rubik frames to execute on the GPU runner
        required: true
        default: "600"
        type: string

permissions:
  contents: read

concurrency:
  group: gpu-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubik-gpu:
    name: Rubik graphics milestone
    # Free by default. `area: gpu` is a PR classification label, not a runner
    # label. A real GPU runner can be selected explicitly through dispatch.
    runs-on: "${{ inputs.runner_label || 'windows-latest' }}"
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Inspect graphics adapter
        id: adapter
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gpu-artifacts | Out-Null
          $nvidia = Get-Command nvidia-smi -ErrorAction SilentlyContinue
          if ($null -ne $nvidia) {
            nvidia-smi
            nvidia-smi | Out-File -Encoding utf8 gpu-artifacts/adapter.txt
            "has_hardware_gpu=true" >> $env:GITHUB_OUTPUT
          } else {
            Get-CimInstance Win32_VideoController |
              Select-Object Name, DriverVersion, AdapterRAM |
              Format-List
            Get-CimInstance Win32_VideoController |
              Select-Object Name, DriverVersion, AdapterRAM |
              Format-List | Out-File -Encoding utf8 gpu-artifacts/adapter.txt
            "has_hardware_gpu=false" >> $env:GITHUB_OUTPUT
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Build Rubik GPU example
        run: cargo build --locked --release --example rubik_3d --all-features

      - name: Run CPU milestone benchmark on graphics host
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target/criterion-gpu-host"
          cargo bench --locked --bench performance_milestone
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $report = Get-ChildItem -Path target/criterion-gpu-host/criterion `
            -Filter index.html -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $report) {
            throw 'Criterion graphics-host CPU baseline did not emit an HTML report'
          }

      - name: Run bounded Rubik graphics workload
        shell: pwsh
        env:
          RKE_RUBIK_MAX_FRAMES: ${{ inputs.frames || '600' }}
        run: |
          cargo run --locked --release --example rubik_3d --all-features 2>&1 |
            Tee-Object -FilePath gpu-artifacts/rubik-gpu-run.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (Select-String -Path gpu-artifacts/rubik-gpu-run.log -Pattern 'rubik_3d_gpu:') {
            'execution_mode=hardware-or-driver-backed' | Out-File -Encoding utf8 gpu-artifacts/execution-mode.txt
          } elseif ('${{ steps.adapter.outputs.has_hardware_gpu }}' -eq 'false' -and
              (Select-String -Path gpu-artifacts/rubik-gpu-run.log -Pattern 'rubik_3d:')) {
            'execution_mode=free-software-validation' | Out-File -Encoding utf8 gpu-artifacts/execution-mode.txt
            'The free GitHub-hosted runner has no dedicated GPU; native GPU timing was not asserted.' |
              Out-File -Encoding utf8 gpu-artifacts/execution-mode.txt -Append
          } else {
            throw 'Rubik workload did not emit either a GPU timing report or a valid software fallback report'
          }

      - name: Upload GPU runtime log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpu-quality-milestone-${{ github.run_id }}
          path: |
            gpu-artifacts/
            target/criterion-gpu-host/criterion/
          if-no-files-found: warn
