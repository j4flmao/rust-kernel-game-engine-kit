name: native correctness
on:
  pull_request:
    paths: ["native/**", "src/native_accel.rs", "tests/native_differential.rs", "build.rs", "Cargo.*", ".github/workflows/native-*.yml"]
  push:
    branches: ["**"]
    paths: ["native/**", "src/native_accel.rs", "tests/native_differential.rs", "build.rs", "Cargo.*", ".github/workflows/native-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  differential:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: ubuntu-24.04
            cc: clang
          - os: windows-2022
            cc: rust-fallback
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Compare selected backend with scalar Rust
        run: cargo test --locked --test native_differential --features native-accel
      - name: Check feature-disabled fallback
        run: cargo test --locked --test native_differential --no-default-features
