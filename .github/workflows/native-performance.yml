name: native performance

on:
  pull_request:
    paths:
      - "native/**"
      - "src/native_accel.rs"
      - "benches/native_accel.rs"
      - "tests/native_differential.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "shaders/**"
      - ".github/workflows/native-performance.yml"
  push:
    branches: ["**"]
    paths:
      - "native/**"
      - "src/native_accel.rs"
      - "benches/native_accel.rs"
      - "tests/native_differential.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "shaders/**"
      - ".github/workflows/native-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RKE_REQUIRE_GLSLC: "1"

jobs:
  native-benchmark:
    name: native C/Rust benchmark (${{ matrix.cc }})
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: ${{ matrix.cc }}
      CARGO_TARGET_DIR: target/native-performance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install --yes glslc
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Check native feature and shaders
        run: cargo check --locked --all-targets --all-features
      - name: Run native correctness tests
        run: |
          cargo test --locked --lib --all-features native_accel
          cargo test --locked --test native_differential --features native-accel
      - name: Record benchmark environment
        run: |
          mkdir -p target/native-performance
          {
            rustc -Vv
            "$CC" --version
            lscpu
            printf '\nBackend: c (Unix + native-accel); baseline: checked scalar Rust\n'
            printf 'Results measure CPU batches, not rendered FPS.\n'
          } > target/native-performance/environment.txt
      - name: Run native benchmark report
        run: cargo bench --locked --bench native_accel --features native-accel
      - name: Require HTML report
        run: test -s target/native-performance/criterion/report/index.html
      - name: Upload Criterion report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-criterion-report-${{ matrix.cc }}
          path: |
            target/native-performance/criterion/
            target/native-performance/environment.txt
          if-no-files-found: error
