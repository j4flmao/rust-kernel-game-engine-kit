name: native performance

on:
  pull_request:
    paths:
      - "native/**"
      - "src/native_accel.rs"
      - "benches/native_accel.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "shaders/**"
      - ".github/workflows/native-performance.yml"
  push:
    branches: ["**"]
    paths:
      - "native/**"
      - "src/native_accel.rs"
      - "benches/native_accel.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "shaders/**"
      - ".github/workflows/native-performance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RKE_REQUIRE_GLSLC: "1"

jobs:
  native-benchmark:
    name: native C/Rust benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install --yes glslc
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Check native feature and shaders
        run: cargo check --locked --all-targets --all-features
      - name: Run native correctness tests
        run: cargo test --locked --lib --all-features native_accel
      - name: Run native benchmark report
        run: cargo bench --locked --bench native_accel --features native-accel -- --noplot
      - name: Upload Criterion report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-criterion-report
          path: target/criterion/
          if-no-files-found: error
