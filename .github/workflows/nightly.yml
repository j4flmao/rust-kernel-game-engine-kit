name: nightly reliability

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-reliability
  cancel-in-progress: true

jobs:
  extended-tests:
    name: repeated engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run repeated test cycles
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 20); do
            echo "reliability cycle ${cycle}/20"
            cargo test --lib --tests --all-features -- --test-threads=1
          done

  extended-fuzz:
    name: extended scheduler fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu scheduler_input -- -runs=10000 -timeout=10 -max_total_time=600 -rss_limit_mb=2048
        working-directory: fuzz
