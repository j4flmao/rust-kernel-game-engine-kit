name: tagged release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: release bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            suffix: ""
          - os: windows-2022
            platform: windows-x86_64
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Require tag commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          main_sha="$(git rev-parse "origin/main^{commit}")"
          if [ "${tag_sha}" != "${main_sha}" ]; then
            echo "Release tags must point to the current origin/main commit."
            echo "tag=${tag_sha} main=${main_sha}"
            exit 1
          fi
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${tag_version}" = "${package_version}"
      - name: Run release test gate
        run: cargo test --locked --lib --tests --all-features -- --test-threads=1
      - name: Build release binaries and examples
        run: cargo build --locked --release --bins --examples
      - name: Create release bundle
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BIN_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/rust-kernel-kit${BIN_SUFFIX}" dist/
          cp "target/release/examples/sudoku_game${BIN_SUFFIX}" dist/
          archive="dist/${PLATFORM}-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "${archive}" -C dist \
            "rust-kernel-kit${BIN_SUFFIX}" \
            "sudoku_game${BIN_SUFFIX}"
          (cd dist && sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  draft-release:
    name: create draft GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
