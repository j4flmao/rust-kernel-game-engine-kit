[package]
name = "rust-kernel-game-engine-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Microkernel-style game engine core in Rust."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/j4flmao/rust-kernel-game-engine-kit"
keywords = ["game-engine", "ecs", "kernel", "runtime", "rust"]
categories = ["game-engines", "os"]

[features]
default = []
# Records contention counters (CAS-fail sites, thread ids) into the tracer.
race_trace = []
# Enables the optional batch transform accelerator on Unix targets. The safe
# Rust implementation remains the default and is always available.
native-accel = []

[dependencies]
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
opt-level = 1

[profile.bench]
opt-level = 3
lto = "fat"

[[bench]]
name = "kernel"
harness = false

# Quality milestone reporting is separate from the kernel benchmark report.
[[bench]]
name = "performance_milestone"
harness = false
path = "benches/quality_milestones/performance_milestone.rs"

[[bench]]
name = "native_accel"
harness = false
path = "benches/native_accel.rs"

[lints.rust]
unsafe_code = "warn"

[[bin]]
name = "rust-kernel-kit"
path = "src/main.rs"
